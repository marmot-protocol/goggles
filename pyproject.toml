[project]
name = "goggles"
version = "0.1.0"
description = "Internal Marmot audit-log explorer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dj-database-url>=3.1.2,<4",
    "django>=6.0.6,<6.1",
    "gunicorn>=26.0.0,<27",
    "jsonschema>=4.25,<5",
    "psycopg[binary]>=3.3.4,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["forensics/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
