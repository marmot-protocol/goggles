services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${GOGGLES_ENV_FILE:-.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: goggles_test
      POSTGRES_USER: goggles
      POSTGRES_PASSWORD: goggles
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${GOGGLES_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  web: &app
    build: .
    init: true
    restart: unless-stopped
    # Keep a pathological request inside the Goggles cgroup instead of letting
    # it exhaust host RAM and swap. Equal memory/swap limits disable additional
    # swap allocation for this container.
    mem_limit: ${GOGGLES_WEB_MEMORY_LIMIT:-16g}
    memswap_limit: ${GOGGLES_WEB_MEMORY_LIMIT:-16g}
    mem_swappiness: 0
    cpus: ${GOGGLES_WEB_CPUS:-2.0}
    pids_limit: ${GOGGLES_WEB_PIDS_LIMIT:-256}
    env_file: ${GOGGLES_ENV_FILE:-.env}
    # Fail closed if the proxy accidentally sends an upload to the read pool.
    environment:
      GOGGLES_UPLOADS_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static-assets:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    # Operational fields only; never log request paths, headers, IPs or user agents.
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers $${GOGGLES_WEB_WORKERS:-3} --threads $${GOGGLES_WEB_THREADS:-2} --timeout $${GOGGLES_WEB_TIMEOUT_SECONDS:-300} --max-requests $${GOGGLES_WEB_MAX_REQUESTS:-500} --max-requests-jitter $${GOGGLES_WEB_MAX_REQUESTS_JITTER:-50} --access-logfile - --access-logformat '%(t)s %(m)s %(s)s %(B)s %(L)s'
    logging:
      driver: json-file
      options:
        max-size: ${GOGGLES_WEB_LOG_MAX_SIZE:-20m}
        max-file: ${GOGGLES_WEB_LOG_MAX_FILES:-5}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; host = os.environ.get('DJANGO_ALLOWED_HOSTS', '127.0.0.1').split(',')[0].strip(); request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host}); urllib.request.urlopen(request, timeout=2).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    <<: *app
    # Two synchronous processes: a busy upload cannot consume a browsing slot.
    # Transfer progress has a separate finite budget; validation/projection
    # retain sync's hard deadline. Idle sockets cannot heartbeat indefinitely.
    environment:
      GOGGLES_UPLOADS_ENABLED: ${GOGGLES_UPLOADS_ENABLED:-1}
    mem_limit: ${GOGGLES_INGEST_MEMORY_LIMIT:-4g}
    memswap_limit: ${GOGGLES_INGEST_MEMORY_LIMIT:-4g}
    cpus: ${GOGGLES_INGEST_CPUS:-1.0}
    ports:
      - "127.0.0.1:8002:8000"
    volumes: []
    depends_on:
      web:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python manage.py check --deploy --database default --tag database &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class deploy.ingest_worker.IngestWorker --workers $${GOGGLES_INGEST_WORKERS:-2} --threads 1 --timeout $${GOGGLES_INGEST_TIMEOUT_SECONDS:-120} --graceful-timeout 120 --backlog 8 --max-requests 100 --max-requests-jitter 10 --access-logfile - --access-logformat '%(t)s %(m)s %(s)s %(B)s %(L)s'
    # Both slots may legitimately be ingesting. Probe health through web;
    # monitor ingest process exits, 503s, durations and database transactions.
    healthcheck:
      disable: true

  retention:
    build: .
    init: true
    restart: unless-stopped
    # Bound catch-up deletes and projection rebuilds just like web workloads.
    mem_limit: ${GOGGLES_WEB_MEMORY_LIMIT:-16g}
    memswap_limit: ${GOGGLES_WEB_MEMORY_LIMIT:-16g}
    mem_swappiness: 0
    cpus: ${GOGGLES_WEB_CPUS:-2.0}
    pids_limit: ${GOGGLES_WEB_PIDS_LIMIT:-256}
    env_file: ${GOGGLES_ENV_FILE:-.env}
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "deploy/prune_nightly.py"]
    logging:
      driver: json-file
      options:
        max-size: ${GOGGLES_WEB_LOG_MAX_SIZE:-20m}
        max-file: ${GOGGLES_WEB_LOG_MAX_FILES:-5}

  static:
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - static-assets:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8001:80"

volumes:
  postgres-data:
  static-assets:
